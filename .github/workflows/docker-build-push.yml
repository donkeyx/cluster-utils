name: Docker build and push

on:
  push:
    branches: [ master, 'release/*']
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ master ]

env:
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:
    environment: deployment # this gets the secrets for deployments

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Capture build vars
        id: vars
        shell: bash
        run: |
          git_ref=$(echo ${GITHUB_REF#refs/*/}| tr "/" "-" )
          hash=${GITHUB_SHA::6}

          if [ "$GITHUB_REF_TYPE" == "tag" ]; then
            echo "processing tag"
            docker_tag="$git_ref"

            echo "docker tag string latest"
            latest_tag=" -t \donkeyx/cluster-utils:latest"

          fi

          if [ "$GITHUB_REF_TYPE" == "branch" ]; then
            echo "processing branch"

            if [ "$git_ref" == "master" ]; then
              echo "match latest"
              docker_tag=latest
            fi
            
            docker_tag="${git_ref}"
          fi

          echo "branch: $git_ref"
          echo "hash: $hash"
          echo "dockertag: $docker_tag"

          echo "git_ref=$git_ref" >> $GITHUB_OUTPUT
          echo "sha_short=$hash" >> $GITHUB_OUTPUT
          echo "docker_tag=$docker_tag" >> $GITHUB_OUTPUT
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT
          
      # for multi architecture builds arm/x86
      - name: Setup QEMU runner
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      # ################################
      # push docker images (dockerhub/github)
      # ################################ 
      - name: Verify DockerHub secrets
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USER }}" ]; then
            echo "❌ DOCKERHUB_USER secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKERHUB_PASS }}" ]; then
            echo "❌ DOCKERHUB_PASS secret is not set"  
            exit 1
          fi
          echo "✅ DockerHub secrets are configured"

      - name: Log into registry (dockerhub)
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}


      - name: Build and push docker image (dockerhub)
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_USER != ''
        run: | 

          docker buildx build \
          --platform linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64 \
          -t "donkeyx/cluster-utils:${{ steps.vars.outputs.docker_tag }}" \
          ${{ steps.vars.outputs.latest_tag }} \
          --push \
          .


      - name: Log into registry (github)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build and push docker image (github)
        run: | 
          docker buildx build \
          --platform linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64 \
          -t "ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.docker_tag }}" \
          ${{ steps.vars.outputs.latest_tag }} \
          --push \
          .
